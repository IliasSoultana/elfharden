name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # No third-party dependencies, so there is no go.sum to key a
          # cache on. Disabling it avoids a spurious cache-miss warning.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o elfharden .

      # Scanning the runner's own binaries is a real end-to-end check: it
      # proves the tool parses production ELF files, not just test fixtures.
      - name: Smoke test against system binaries
        run: |
          ./elfharden /usr/bin | head -20
          ./elfharden -json /usr/bin/ls

  nix:
    name: Nix flake and NixOS image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Packing a qcow2 runs a QEMU VM, so the build needs /dev/kvm. GitHub's
      # Linux runners have the device but do not grant access to the runner
      # user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Flake check
        run: nix flake check --all-systems

      - name: Build the scanner
        run: nix build .#elfharden --print-build-logs

      - name: Build the system closure
        run: nix build .#toplevel --print-build-logs -o result-toplevel

      - name: Show the generated systemd unit
        run: cat result-toplevel/etc/systemd/system/elfharden.service

      # systemd-repart needs nested user namespaces.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build the reproducible verity image
        run: nix build .#verity-image --print-build-logs -o result-verity

      - name: Show the dm-verity root hash
        run: grep roothash result-verity/repart-output.json

      # Builds the derivation a second time and compares byte-for-byte.
      - name: Prove the image build is reproducible
        run: nix build .#verity-image --rebuild --print-build-logs

      - name: Build the NixOS qcow2 image
        run: nix build .#image --print-build-logs -o result-image

      - name: Report image size
        run: ls -lh result-image/

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: nixos-scanner-image
          path: result-image/*
          if-no-files-found: warn
